name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy transcribe-webhook
        run: supabase functions deploy transcribe-webhook --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy transcribe
        run: supabase functions deploy transcribe --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy storage
        run: supabase functions deploy storage --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy summarize
        run: supabase functions deploy summarize --project-ref "$SUPABASE_PROJECT_ID"
